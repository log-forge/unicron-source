[tool.poetry]
name = "notifier"
version = "0.1.0"
description = "LogForge Unicron notifier service"
authors = ["LogForge contributors"]
license = "LicenseRef-LogForge-Unicron-Proprietary"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = {extras = ["standard"], version = "^0.115.0"}
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.10.0"
pydantic-settings = "^2.6.0"
orjson = "^3.10.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
sqlmodel = "^0.0.24"
asyncpg = "^0.30.0"
redis = "^5.2.0"
httpx = "^0.28.0"
apprise = "^1.9.0"
cryptography = "^44.0"
celery = {extras = ["redis"], version = "^5.4.0"}
gevent = "^24.2"
jinja2 = "^3.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
