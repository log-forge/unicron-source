[SERVICE]
  Flush       1
  Log_Level   info
  HTTP_Server On
  HTTP_Listen 0.0.0.0
  # avoids clash with FastAPI
  HTTP_Port   2021

# ──────────────────────────────────────────────────────────────
# INPUT A: real-time logs from containers using the fluentd driver
# ──────────────────────────────────────────────────────────────
[INPUT]
  Name              forward
  Tag               docker.forward.*
  Listen            0.0.0.0
  Port              24224
  Buffer_Chunk_Size 1M
  Buffer_Max_Size   6M

# ──────────────────────────────────────────────────────────────
# INPUT B: Tail Docker JSON files for ALL running containers
#          Docker_Mode automatically parses JSON and adds:
#          container_id, container_name, image_name, etc.
# ──────────────────────────────────────────────────────────────
[INPUT]
  Name             tail
  Path             /var/lib/docker/containers/*/*.log
  Tag              docker.tail.*
  # parse Docker JSON + enrich metadata
  Docker_Mode      On
  # Expose original file path as 'path' key so lua enrichment can parse container id
  Path_Key         path
  DB               /tmp/flb_tail.db
  Refresh_Interval 5
  Skip_Long_Lines  On
  Mem_Buf_Limit    64MB

# ─────────────────────────────────────────────
# FILTER 1 – add host name
# ─────────────────────────────────────────────
[FILTER]
  Name  modify
  Match docker.tail.*
  # herald.id, herald.env, service.name, service.namespace, service.instance.id, container.id, container.name, image.name
  # normalized keys to match OTel resource attribute names
  Add   herald_id ${HERALD_ID}
  Add   herald_name ${HERALD_NAME}
  Add   herald_env ${ENVIRONMENT}
  Add   service_instance_id ${HERALD_ID}
  Add   service_name ${HERALD_NAME}
  Add   service_namespace unicron.herald

# ─────────────────────────────────────────────
# FILTER 2 – docker_meta.lua enrichment (apply to forward + tail for uniform metadata)
# ─────────────────────────────────────────────
[FILTER]
  Name          lua
  Match         docker.tail.*
  script        /app/herald/lua/docker_meta.lua
  call          enrich
  time_as_table true

# OUTPUT – send as OTLP logs (mTLS via Traefik to central OTel Collector)
[OUTPUT]
  Name                 opentelemetry
  Match                docker.*
  Host                 ${UNICRON_CENTRAL_FQDN}
  Port                 8443
  tls                  On
  tls.verify           On
  tls.ca_file          ${HERALD_CA_ROOT}
  tls.crt_file         ${HERALD_CERT}
  tls.key_file         ${HERALD_KEY}
  logs_uri             /unicron/otel/v1/logs
  logs_body_key        log
  # enable payload logging so we can inspect what Fluent Bit sends to the collector for debugging
  # remember to disable in production as it can leak sensitive data
  log_response_payload true

# --- Optional debug ---
