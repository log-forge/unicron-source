[project]
name = "logforge-central-backend"
version = "0.1.0"
description = "LogForge Unicron Central backend"
authors = [
    {name = "LogForge contributors"}
]
license = "LicenseRef-LogForge-Unicron-Proprietary"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard] (>=0.115.14,<0.116.0)",
    "pydantic (>=2.11.7,<3.0.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "orjson (>=3.10.18,<4.0.0)",
    "sqlmodel (>=0.0.24,<0.0.25)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "apscheduler (>=3.11.0,<4.0.0)",
    "cryptography (>=45.0.5,<46.0.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "python-socketio[asgi] (>=5.13.0,<6.0.0)",
    "redis (>=6.4.0,<7.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "protobuf (>=5.29.0,<6.0.0)",
    "opentelemetry-proto (>=1.31.0,<2.0.0)",
    "unicron_shared @ ../../../libs/unicron_shared",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
alembic = "^1.16.2"
