services:
  unicron:
    image: ${UNICRON_IMAGE:-logforge/unicron:latest}
    container_name: ${UNICRON_CONTAINER_NAME:-unicron-appliance}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777,size=256m
      - /run:rw,nosuid,nodev,mode=755,size=64m
      - /run/pyinstaller:rw,nosuid,nodev,exec,mode=1777,size=256m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - unicron-stepca:127.0.0.1
      - unicron-stepca-ra:127.0.0.1
      - unicron.central:127.0.0.1
      - ${UNICRON_CENTRAL_FQDN:-localhost}:127.0.0.1
    networks:
      default:
        aliases:
          # Local agents use this TLS hostname when they join the appliance network.
          - unicron.central
    ports:
      - ${UNICRON_HTTP_PORT:-80}:80
      - ${UNICRON_HTTPS_PORT:-443}:443
      - ${UNICRON_MTLS_PORT:-8443}:8443
    environment:
      UNICRON_MANAGED_BY: standalone
      UNICRON_CENTRAL_FQDN: ${UNICRON_CENTRAL_FQDN:-localhost}
      UNICRON_PUBLIC_CENTRAL_PORT: ${UNICRON_HTTPS_PORT:-443}
      UNICRON_PUBLIC_CENTRAL_MTLS_PORT: ${UNICRON_MTLS_PORT:-8443}
      UNICRON_APPLIANCE_CONTAINER_NAME: ${UNICRON_CONTAINER_NAME:-unicron-appliance}
      TMPDIR: /run/pyinstaller
      CENTRAL_ADMIN_USERNAME: ${CENTRAL_ADMIN_USERNAME:-admin}
      CENTRAL_ADMIN_PASSWORD: ${CENTRAL_ADMIN_PASSWORD:-}
      CENTRAL_ADMIN_RECOVERY_OVERRIDE: ${CENTRAL_ADMIN_RECOVERY_OVERRIDE:-false}
      REMOTE_AGENT_IMAGE: ${REMOTE_AGENT_IMAGE:-logforge/unicron-agent:latest}
      UNICRON_SELF_UPDATE_ENABLED: ${UNICRON_SELF_UPDATE_ENABLED:-true}
      UNICRON_UPDATE_IMAGE_REF: ${UNICRON_UPDATE_IMAGE_REF:-}
      UNICRON_UPDATE_INTERVAL_SECONDS: ${UNICRON_UPDATE_INTERVAL_SECONDS:-21600}
    volumes:
      - unicron-data:/var/lib/unicron
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  unicron-data:
    name: unicron-data

networks:
  default:
    # Keep this stable because locally generated agent enrollment commands join it.
    name: ${UNICRON_DOCKER_NETWORK:-logforge-unicron-network}
